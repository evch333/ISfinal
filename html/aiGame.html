<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Snake Game</title>
  <style>
    body {
      margin: 0;
      background-color: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      position: relative;
    }

    #score, #high-score {
      color: #fff;
      font-size: 24px;
      font-family: Arial, sans-serif;
      margin-bottom: 10px;
    }

    #restart-btn {
      display: none;
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 18px;
      border: none;
      border-radius: 6px;
      background-color: #00f;
      color: #fff;
      cursor: pointer;
    }

    canvas {
      background-color: #222;
      border: 2px solid #00f;
    }
  </style>
</head>
<body>
  <div id="score">Score: 0</div>
  <div id="high-score">High Score: 0</div>
  <canvas id="game" width="400" height="400"></canvas>
  <button id="restart-btn">Start Game</button>

  <!-- Add sound for game over -->
  <audio id="game-over-sound" src="https://www.soundjay.com/button/beep-07.wav" preload="auto"></audio>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const restartBtn = document.getElementById("restart-btn");
    const scoreDisplay = document.getElementById("score");
    const highScoreDisplay = document.getElementById("high-score");
    const gameOverSound = document.getElementById("game-over-sound");

    const scale = 20;
    const rows = canvas.height / scale;
    const cols = canvas.width / scale;

    let snake;
    let fruit;
    let gameLoop;
    let highScore = 0;  // Variable to track high score

    function startGame() {
      snake = new Snake();
      fruit = randomPosition();
      scoreDisplay.textContent = "Score: 0";
      restartBtn.style.display = "none";

      clearInterval(gameLoop);
      gameLoop = setInterval(() => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        snake.update();
        snake.draw();
        drawFruit();

        if (snake.eat(fruit)) {
          fruit = randomPosition();
          scoreDisplay.textContent = "Score: " + snake.total;
        }

        if (snake.hitWall() || snake.hitSelf()) {
          gameOverSound.play();  // Play game over sound
          clearInterval(gameLoop);
          if (snake.total > highScore) {
            highScore = snake.total; // Update high score
            highScoreDisplay.textContent = "High Score: " + highScore;
          }
          restartBtn.style.display = "block";
        }
      }, 150);
    }

    function randomPosition() {
      return {
        x: Math.floor(Math.random() * cols) * scale,
        y: Math.floor(Math.random() * rows) * scale,
      };
    }

    function drawFruit() {
      ctx.fillStyle = "#f00";
      ctx.fillRect(fruit.x, fruit.y, scale, scale);
    }

    function Snake() {
      this.x = 0;
      this.y = 0;
      this.xSpeed = scale;
      this.ySpeed = 0;
      this.total = 0;
      this.tail = [];

      this.draw = function () {
        ctx.fillStyle = "#00f";
        for (let i = 0; i < this.tail.length; i++) {
          ctx.fillRect(this.tail[i].x, this.tail[i].y, scale, scale);
        }
        ctx.fillRect(this.x, this.y, scale, scale);
      };

      this.update = function () {
        for (let i = 0; i < this.tail.length - 1; i++) {
          this.tail[i] = this.tail[i + 1];
        }

        if (this.total >= 1) {
          this.tail[this.total - 1] = { x: this.x, y: this.y };
        }

        this.x += this.xSpeed;
        this.y += this.ySpeed;
      };

      this.eat = function (pos) {
        if (this.x === pos.x && this.y === pos.y) {
          this.total++;
          return true;
        }
        return false;
      };

      this.changeDirection = function (direction) {
        switch (direction) {
          case "ArrowUp":
            if (this.ySpeed === 0) {
              this.xSpeed = 0;
              this.ySpeed = -scale;
            }
            break;
          case "ArrowDown":
            if (this.ySpeed === 0) {
              this.xSpeed = 0;
              this.ySpeed = scale;
            }
            break;
          case "ArrowLeft":
            if (this.xSpeed === 0) {
              this.xSpeed = -scale;
              this.ySpeed = 0;
            }
            break;
          case "ArrowRight":
            if (this.xSpeed === 0) {
              this.xSpeed = scale;
              this.ySpeed = 0;
            }
            break;
        }
      };

      this.hitWall = function () {
        return (
          this.x < 0 ||
          this.y < 0 ||
          this.x >= canvas.width ||
          this.y >= canvas.height
        );
      };

      this.hitSelf = function () {
        for (let i = 0; i < this.tail.length; i++) {
          if (this.x === this.tail[i].x && this.y === this.tail[i].y) {
            return true;
          }
        }
        return false;
      };
    }

    window.addEventListener("keydown", (e) => {
      if (gameLoop) snake.changeDirection(e.key);
    });

    restartBtn.addEventListener("click", startGame);

    startGame(); // Game starts on page load
  </script>
</body>
</html>
